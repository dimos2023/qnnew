<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Hosted under a site sub-path; <base> keeps the relative frame/asset URLs
       correct regardless of clean-URL rewrites. -->
  <base href="/assets/models/u8l/yangwang-u8-360/">
  <title>Yangwang U8 — QN Automotive 360°</title>
  <link rel="stylesheet" href="styles.css">
  <!-- When embedded in the configurator (?embed=1) hide the built-in chrome so
       only the rotatable car shows; our side panel drives the colour. -->
  <script>if (location.search.indexOf('embed') !== -1) document.documentElement.className += ' embed';</script>
  <style>
    .embed header, .embed .controls, .embed .drag-hint { display: none !important; }
    .embed, .embed body { background: #0d0d0d !important; }
    .embed .viewer { height: 100vh; display: grid; }
    .embed .stage { height: 100vh; }
  </style>
</head>
<body>
  <main class="viewer" aria-label="Yangwang U8 360 degree viewer">
    <header>
      <img class="brand" src="assets/qn-motors-logo.png" alt="QN Motors">
      <div>
        <p>YANGWANG</p>
        <h1>U8</h1>
      </div>
    </header>

    <section class="stage" id="stage">
      <img id="car" src="assets/black/9.png" alt="Yangwang U8 exterior view" draggable="false">
      <div class="loading" id="loading">Loading 360°…</div>
      <div class="drag-hint">↔ Drag to rotate</div>
    </section>

    <section class="controls">
      <div>
        <span class="label">Exterior</span>
        <strong id="colorName">Obsidian Black</strong>
      </div>
      <div class="swatches" aria-label="Exterior color">
        <button class="swatch black active" data-color="black" data-name="Obsidian Black" aria-label="Obsidian Black"></button>
        <button class="swatch white" data-color="white" data-name="Snow White" aria-label="Snow White"></button>
      </div>
      <button class="play" id="play" type="button">Auto rotate</button>
    </section>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
